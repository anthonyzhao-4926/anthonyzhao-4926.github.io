<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">

<head>
    {% include head.html %}
</head>

<body>
    {% include header.html %}

    <main
        class="container main-content{% if page.layout == 'column' or page.column or page.layout == 'post' %} wide{% endif %}">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p class="mono">© {{ site.time | date: "%Y" }} {{ site.title }}<span class="dot"> · </span>记录与分享</p>
    </footer>

    <!-- 全站搜索浮层 -->
    <div id="search-overlay" class="search-overlay" hidden>
        <div class="search-panel" role="dialog" aria-label="搜索">
            <div class="search-input-row">
                <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input id="search-input" type="search" placeholder="搜索文章…" autocomplete="off" aria-label="搜索文章">
                <button id="search-close" class="search-close" aria-label="关闭搜索">×</button>
            </div>
            <div id="search-results" class="search-results"></div>
            <p id="search-empty" class="search-empty" hidden>没有匹配的文章。</p>
        </div>
    </div>

    <div id="img-lightbox" class="img-lightbox" hidden>
        <img id="img-lightbox-img" alt="">
    </div>

    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/drafts.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/mermaid.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}"></script>
</body>

</html>
