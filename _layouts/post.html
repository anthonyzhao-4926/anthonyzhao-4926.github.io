---
layout: default
---
{% if page.column %}
{% include column-shell.html %}
{% else %}
<div class="post-shell">
    <article class="post toc-source">
        <header class="post-header">
            <p class="post-flag mono"><span class="flag-dot"></span>随笔</p>
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-meta mono">
                <time datetime="{{ page.date | date: " %Y-%m-%d" }}">{{ page.date | date: "%Y-%m-%d" }}</time>
            </p>
        </header>
        <div class="post-content">
            {{ content }}
        </div>
    </article>
    <aside class="col-right">
        <p class="col-toc-label mono">本文目录</p>
        <ul class="col-toc" id="col-toc"></ul>
    </aside>

    <button id="col-toggle" class="col-toggle" type="button" aria-pressed="false" title="切换中栏宽度">
        <svg class="col-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h6v6"></path>
            <path d="M9 21H3v-6"></path>
            <path d="M21 3l-7 7"></path>
            <path d="M3 21l7-7"></path>
        </svg>
        <span class="label">全宽</span>
    </button>
</div>
{% endif %}
