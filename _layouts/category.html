---
layout: default
---
<article class="page">
    <h1 class="page-title">分类：{{ page.title }}</h1>
    <div class="page-content">
        <ul class="archive-list">
            {% for post in page.posts %}
            <li>
                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
                <span class="muted"> · {{ post.date | date: "%Y-%m-%d" }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</article>
