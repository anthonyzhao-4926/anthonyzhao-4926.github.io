<header class="site-header">
    <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}"><span class="logo-dot"></span>{{ site.title }}</a>
        <nav class="site-nav">
            <a href="{{ '/' | relative_url }}" {% if page.layout=='home' %} class="active" {% endif %}>首页</a>
            {% for tab in site.tabs %}
            <a href="{{ tab.url | relative_url }}" {% if tab.url==page.url %} class="active" {% endif %}>{{ tab.title
                }}</a>
            {% endfor %}
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色">🌙</button>
    </div>
</header>
