# ==========================================================
# Jekyll 自研主题核心配置（不依赖任何第三方主题）
# ==========================================================

# 站点语言与时区
lang: zh-CN
timezone: Asia/Shanghai

# 站点信息
title: zhaoxin 的博客
tagline: 记录与分享
description: >-
  zhaoxin 的个人博客，基于 Jekyll 自研主题构建，
  记录技术学习与生活随笔。
url: "https://blog.zhaoxin.website"   # 与 CNAME 文件保持一致
baseurl: ""                            # 项目站点部署（子路径）时才需要填写

# GitHub 账号
github:
  username: anthonyzhao-4926

# 社交信息（会显示在侧边栏）
social:
  name: zhaoxin
  email: ""                            # 填写邮箱后侧边栏会显示邮件图标
  links:
    - https://github.com/anthonyzhao-4926

# 主题外观：深浅色切换由 assets/js/theme.js 控制（不写死主题模式）

# 文章右侧目录（TOC）：自研主题暂未提供
# toc: true

# 评论功能（可选，后续可开启 giscus / utterances / disqus）
comments:
  active: false

# 首页分页：每页展示的文章数
paginate: 10

# 代码高亮
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false

# _tabs 顶层页面集合 + _columns 专栏集合
collections:
  tabs:
    output: true
    sort_by: order
  # 专栏集合：_columns/ 下的每个文件 = 一个专栏
  columns:
    output: true
    sort_by: order

# 文章默认值
# 注意：无第三方主题时，所有页面必须显式指定 layout（或由 defaults 兜底）
defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: _drafts
      type: drafts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: columns
    values:
      layout: column
      permalink: /columns/:title/

# 插件列表（与 Gemfile 保持一致）
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# 分类 / 标签归档页（由 jekyll-archives 生成）
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
