<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>专栏 · 规划预览</title>
    <style>
        :root {
            --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans SC", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #1f2c2b;
            --muted: #7c8f8c;
            --accent: #379a90;
            --accent-soft: rgba(55, 154, 144, 0.10);
            --cinnabar: #e0825a;
            --line: #e8eeee;
            --line-strong: #d4dfdc;
            --header-bg: rgba(255, 255, 255, 0.86);
            --ink-soft: #eef5f3;
        }

        [data-theme="dark"] {
            --bg: #1b1b1f;
            --text: #dfdfd6;
            --muted: #98989f;
            --accent: #57b4a6;
            --accent-soft: rgba(87, 180, 166, 0.12);
            --cinnabar: #e8926f;
            --line: #2b2b31;
            --line-strong: #3a3a42;
            --header-bg: rgba(27, 27, 31, 0.82);
            --ink-soft: #222226;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.9;
        }

        ::selection { background: var(--accent); color: #fff; }
        a { color: inherit; text-decoration: none; }
        .mono { font-family: var(--font-mono); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .site-header {
            border-bottom: 1px solid var(--line);
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-inner, .page, .site-footer {
            max-width: 880px;
            margin: 0 auto;
            padding-left: 28px;
            padding-right: 28px;
        }

        .header-inner {
            display: flex;
            align-items: center;
            gap: 24px;
            height: 64px;
        }

        .site-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .site-title .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--cinnabar);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .site-nav { display: flex; gap: 2px; flex: 1; justify-content: flex-end; }
        .site-nav a { color: var(--muted); font-size: 14.5px; padding: 6px 12px; }
        .site-nav a.active, .site-nav a:hover { color: var(--accent); }

        .theme-toggle {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            border-radius: 50%;
            cursor: pointer;
        }

        .page { padding-top: 36px; padding-bottom: 80px; }

        .head { margin-bottom: 8px; }
        .head .kicker {
            margin: 0 0 12px;
            font-size: 11.5px;
            letter-spacing: .28em;
            color: var(--accent);
        }
        .head h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(32px, 5vw, 42px);
            font-weight: 600;
            line-height: 1.28;
        }
        .head .sub {
            margin: 14px 0 0;
            max-width: 32em;
            color: var(--muted);
            font-size: 16px;
        }
        .head .meta {
            margin: 18px 0 0;
            font-size: 12px;
            letter-spacing: .06em;
            color: var(--muted);
        }
        .head .meta b { color: var(--accent); font-weight: 600; }

        .gloss {
            list-style: none;
            margin: 36px 0 0;
            padding: 0;
            border-top: 1px solid var(--line);
        }

        .gloss li { margin: 0; }

        .gloss a {
            display: grid;
            grid-template-columns: 15.5em 1fr;
            column-gap: 36px;
            padding: 22px 0 20px;
            border-bottom: 1px solid var(--line);
            align-items: start;
        }

        .gloss a:hover .name strong { color: var(--accent); }

        .name { min-width: 0; padding-top: 2px; }

        .name strong {
            display: block;
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
        }

        .name .stat {
            display: block;
            margin-top: 4px;
            font-size: 11.5px;
            letter-spacing: .08em;
            color: var(--muted);
        }

        .name .now {
            color: var(--accent);
            margin-left: 8px;
        }

        .gloss p {
            margin: 4px 0 0;
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--muted);
        }

        .fake {
            display: inline-block;
            margin-left: 6px;
            font-size: 10px;
            letter-spacing: .08em;
            color: var(--muted);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            padding: 0 6px;
            line-height: 1.6;
            vertical-align: middle;
            font-weight: 400;
            font-family: var(--font-body);
        }

        .site-footer {
            padding-bottom: 32px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .header-inner, .page, .site-footer { padding-left: 20px; padding-right: 20px; }
            .gloss a {
                grid-template-columns: 1fr;
                row-gap: 6px;
                padding: 18px 0 16px;
            }
            .name strong { font-size: 18px; }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="site-title" href="#"><span class="dot"></span>zhaoxin 的博客</a>
            <nav class="site-nav">
                <a href="#">主页</a>
                <a href="#" class="active">专栏</a>
                <a href="#">随笔</a>
                <a href="#">关于</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色">🌙</button>
        </div>
    </header>

    <main class="page">
        <header class="head">
            <p class="kicker">专栏</p>
            <h1>把散落的文字，收成几册。</h1>
            <p class="sub">左边是书脊，右边是释文。要找哪一册，顺着名字往下看就好。</p>
            <p class="meta mono">共 <b>14</b> 册 · 按作者排定的次序 · 近 = 最近有写</p>
        </header>

        <ol class="gloss" id="gloss"></ol>
    </main>

    <footer class="site-footer">
        <p>规划预览 · 不是现网。虚构的册标了「拟」。</p>
    </footer>

    <script>
        (function () {
            'use strict';
            var COLUMNS = [
                { title: 'claude code 进阶指南', count: 7, recent: false, fake: false, desc: '用人话拆解指令、工具、记忆、Skills、Hooks 与 Subagent，只讲各组件怎么用。' },
                { title: 'claude agent sdk 指南', count: 8, recent: false, fake: false, desc: '案例驱动地介绍 Claude Agent SDK 的使用方法。' },
                { title: 'linux 命令入门', count: 5, recent: false, fake: false, desc: '' },
                { title: 'golang mcp 学习笔记', count: 14, recent: true, fake: false, desc: '用 Go 写 MCP 服务端，从协议到工具调用。' },
                { title: 'vim 从入门到日常', count: 9, recent: false, fake: true, desc: '从打开文件到跳回原处，把编辑器变成手势。' },
                { title: 'docker 实践', count: 11, recent: false, fake: true, desc: '镜像怎么瘦、容器怎么起，编排里少带一点。' },
                { title: 'rust 并发笔记', count: 8, recent: false, fake: true, desc: '所有权、Arc 与 Mutex。并发出错时，类型会先说话。' },
                { title: '前端工程化', count: 12, recent: false, fake: true, desc: '构建、发布与打包器换代。把日常发布收成一册。' },
                { title: '数据库索引', count: 7, recent: false, fake: true, desc: 'B+Tree、覆盖索引与失效时机。查询慢了来这里。' },
                { title: '网络协议札记', count: 10, recent: false, fake: true, desc: 'TCP、HTTP，以及三次握手之外那些容易忘的。' },
                { title: 'python 爬虫', count: 6, recent: false, fake: true, desc: '抓取、解析、去重。把网页上的材料收成自己的表。' },
                { title: 'kubernetes 入门', count: 4, recent: false, fake: true, desc: '工作负载、服务与滚动更新，先把集群跑起来。' },
                { title: '写作与记录', count: 3, recent: false, fake: true, desc: '怎么把笔记留下来。不写进技术里的那些方法。' },
                { title: '摄影备忘', count: 5, recent: false, fake: true, desc: '曝光、构图、阴天测光。出门前翻一翻。' }
            ];

            document.getElementById('gloss').innerHTML = COLUMNS.map(function (c) {
                var fake = c.fake ? '<i class="fake">拟</i>' : '';
                var now = c.recent ? '<span class="now">近</span>' : '';
                var desc = c.desc ? c.desc : '';
                return '<li><a href="#">' +
                    '<div class="name"><strong>' + c.title + fake + '</strong>' +
                    '<span class="stat mono">' + c.count + ' 篇' + now + '</span></div>' +
                    '<p>' + desc + '</p></a></li>';
            }).join('');

            var root = document.documentElement;
            var themeBtn = document.getElementById('theme-toggle');
            function renderIcon() {
                themeBtn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀' : '🌙';
            }
            themeBtn.addEventListener('click', function () {
                root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
                renderIcon();
            });
            renderIcon();
        })();
    </script>
</body>

</html>
