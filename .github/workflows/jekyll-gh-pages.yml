# Build and deploy a Jekyll site to GitHub Pages (with bundle install,
# because Chirpy theme needs jekyll-archives / jekyll-include-cache which
# are not in the GitHub Pages official whitelist)
name: Deploy Jekyll with GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # 定时重建:构建时重新拉取笔记仓库(见 scripts/notes-repos.txt)的最新提交
  schedule:
    - cron: "23 */1 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # 从 scripts/notes-repos.txt 拉取全部笔记仓库并生成(临时 clone,不入库)
      - name: Generate notes
        run: bash scripts/pull-notes.sh
      # mermaid 服务端渲染(见 _plugins/mermaid.rb)需要 mermaid-cli:Node 运行时 + npm 依赖
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install mermaid-cli
        run: npm ci
      # mermaid-cli 内部 puppeteer 需要 Chromium 系统库
      - name: Install Chromium system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libxshmfence1 libx11-xcb1 libxcb-dri3-0 \
            fonts-noto-cjk
      # 渲染失败即构建失败（严格模式见 _plugins/mermaid.rb），避免部署缺图页面
      - name: Build with Jekyll
        env:
          MERMAID_FAIL_ON_ERROR: "1"
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
